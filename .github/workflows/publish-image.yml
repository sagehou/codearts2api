name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build after upstream synchronization
        required: true
        type: string
      publish_latest:
        description: Publish the synchronized default branch as latest
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Prepare image tags
        id: image
        env:
          PUBLISH_LATEST: ${{ inputs.publish_latest || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision=$(git rev-parse HEAD)
          {
            echo "revision=$revision"
            echo "tags<<EOF"
            echo "$image:sha-$revision"
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
